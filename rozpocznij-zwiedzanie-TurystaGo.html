</style><script>
let transportMode='Pieszo';
function transport(btn,v){
  document.querySelectorAll('#transport .chip').forEach(x=>x.classList.remove('active'));
  btn.classList.add('active');
  transportMode=v;
}
</script>

<style>
#transport { display:flex; flex-wrap:nowrap; gap:6px; }
#transport .chip { flex:1 1 0; min-width:0; padding:10px 5px; font-size:12px; white-space:nowrap; }
</style>
</head>
<body>
<div class="app">
  <div class="hero"></div>
  <div class="panel">
    <div class="top">
      <h1>TURYSTAGO</h1>
    </div>

    <section class="card">
      <h2>🚶 Jak podróżujesz?</h2>
      <div class="chips" id="transport">
        <button class="chip active" onclick="transport(this,'Pieszo')">🚶 Pieszo</button>
        <button class="chip" onclick="transport(this,'Rower')">🚲 Rower</button>
        <button class="chip" onclick="transport(this,'Auto')">🚗 Auto</button>
        <button class="chip" onclick="transport(this,'Autokar')">🚌 Autokar</button>
      </div>
    </section>
  </div>
</div>
