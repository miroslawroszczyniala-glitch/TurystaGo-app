<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TurystaGo – Twój osobisty przewodnik GPS</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #eef3f1;
    color: #18263d;
}

/* =========================
   GŁÓWNY EKRAN
========================= */

.app {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    margin: auto;
    background: #f7faf8;
    overflow: hidden;
    position: relative;
}

/* =========================
   GÓRNY KRAJOBRAZ
========================= */

.hero {
    height: 270px;
    position: relative;
    overflow: hidden;

    background:
        linear-gradient(
            to bottom,
            rgba(89,157,203,.15),
            rgba(255,255,255,.1)
        ),
        linear-gradient(
            135deg,
            #77b6d8,
            #d9eee9
        );
}

/* słońce */

.sun {
    position: absolute;
    width: 90px;
    height: 90px;

    border-radius: 50%;

    background: #fff3b0;

    right: 35px;
    top: 30px;

    box-shadow:
        0 0 40px rgba(255,235,130,.8);
}

/* góry */

.mountain {
    position: absolute;
    bottom: 65px;

    width: 0;
    height: 0;

    border-left: 150px solid transparent;
    border-right: 150px solid transparent;
    border-bottom: 150px solid #6f9d91;
}

.mountain.one {
    left: -80px;
}

.mountain.two {
    left: 130px;
    bottom: 55px;

    border-left-width: 180px;
    border-right-width: 180px;
    border-bottom-width: 175px;

    border-bottom-color: #547f76;
}

.mountain.three {
    right: -100px;
    bottom: 55px;

    border-left-width: 170px;
    border-right-width: 170px;
    border-bottom-width: 155px;

    border-bottom-color: #86aaa0;
}

/* śnieg */

.snow {
    position: absolute;

    width: 0;
    height: 0;

    border-left: 40px solid transparent;
    border-right: 40px solid transparent;
    border-bottom: 55px solid #ffffff;

    bottom: 155px;
    left: 205px;

    opacity: .9;
}

/* dolina */

.valley {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 85px;

    background:
        linear-gradient(
            160deg,
            #4c8c67,
            #83b76e
        );

    border-radius: 50% 50% 0 0;
}

/* =========================
   ZAMEK
========================= */

.castle {
    position: absolute;
    bottom: 53px;
    left: 25px;

    width: 105px;
    height: 65px;

    background: #b8754f;

    border-radius: 3px;
}

.castle::before,
.castle::after {
    content: "";

    position: absolute;

    width: 27px;
    height: 85px;

    background: #a85e45;

    bottom: 0;
}

.castle::before {
    left: -8px;
}

.castle::after {
    right: -8px;
}

.tower-top {
    position: absolute;

    width: 35px;
    height: 35px;

    background: #9d5a43;

    top: -25px;
    left: 35px;
}

.roof {
    position: absolute;

    width: 0;
    height: 0;

    border-left: 23px solid transparent;
    border-right: 23px solid transparent;
    border-bottom: 25px solid #743d35;

    top: -25px;
    left: -6px;
}

/* =========================
   KOŚCIÓŁ
========================= */

.church {
    position: absolute;
    bottom: 51px;
    right: 30px;

    width: 75px;
    height: 65px;

    background: #c7a67d;
}

.church-tower {
    position: absolute;

    width: 28px;
    height: 90px;

    background: #a98565;

    right: 15px;
    bottom: 0;
}

.church-roof {
    position: absolute;

    width: 0;
    height: 0;

    border-left: 22px solid transparent;
    border-right: 22px solid transparent;
    border-bottom: 35px solid #694c45;

    right: 7px;
    top: -35px;
}

/* =========================
   HEADER
========================= */

.header {
    position: absolute;

    top: 0;
    left: 0;

    width: 100%;

    padding: 17px 18px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    z-index: 10;
}

.menu-button,
.notification {
    width: 43px;
    height: 43px;

    border: none;
    border-radius: 50%;

    background: rgba(255,255,255,.92);

    font-size: 21px;

    cursor: pointer;

    box-shadow: 0 3px 10px rgba(0,0,0,.12);
}

.notification {
    position: relative;
}

.notification::after {
    content: "3";

    position: absolute;

    right: -2px;
    top: -2px;

    width: 19px;
    height: 19px;

    border-radius: 50%;

    background: #e63e3e;
    color: white;

    font-size: 11px;

    display: flex;
    align-items: center;
    justify-content: center;
}

/* =========================
   LOGO
========================= */

.logo {
    position: absolute;

    top: 67px;
    left: 0;

    width: 100%;

    text-align: center;

    z-index: 5;
}

.logo h1 {
    font-size: 37px;
    font-weight: 800;

    color: #18263d;

    letter-spacing: -1px;
}

.logo h1 span {
    color: #32a967;
}

.logo p {
    margin-top: 2px;

    font-size: 13px;

    color: #ffffff;

    font-weight: bold;

    text-shadow: 0 1px 4px rgba(0,0,0,.4);
}

/* =========================
   GŁÓWNY PANEL
========================= */

.content {
    position: relative;

    margin-top: -25px;

    padding: 0 15px 25px;

    z-index: 20;
}

/* =========================
   ROZPOCZNIJ
========================= */

.start-button {
    width: 100%;

    min-height: 78px;

    border: none;

    border-radius: 20px;

    background: #35b86b;

    color: white;

    display: flex;

    align-items: center;

    padding: 12px 17px;

    cursor: pointer;

    box-shadow:
        0 8px 18px rgba(0,0,0,.15);
}

.start-icon {
    width: 50px;
    height: 50px;

    background: rgba(255,255,255,.18);

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 25px;

    margin-right: 13px;
}

.start-text {
    flex: 1;
    text-align: left;
}

.start-text strong {
    display: block;

    font-size: 20px;
}

.start-text small {
    display: block;

    margin-top: 4px;

    opacity: .9;
}

.arrow {
    font-size: 27px;
}

/* =========================
   KAFELKI
========================= */

.features {
    display: grid;

    grid-template-columns: repeat(2, 1fr);

    gap: 11px;

    margin-top: 13px;
}

.feature {
    min-height: 105px;

    background: white;

    border-radius: 18px;

    border: none;

    padding: 14px;

    text-align: left;

    cursor: pointer;

    box-shadow:
        0 4px 13px rgba(0,0,0,.08);

    position: relative;
}

.feature-icon {
    font-size: 29px;

    margin-bottom: 8px;
}

.feature strong {
    display: block;

    font-size: 14px;

    line-height: 1.15;
}

.feature small {
    display: block;

    margin-top: 3px;

    color: #758094;

    font-size: 11px;
}

/* kolorowe paski */

.feature::after {
    content: "";

    position: absolute;

    left: 14px;
    right: 14px;

    bottom: 9px;

    height: 3px;

    border-radius: 5px;

    background: #35b86b;
}

.feature:nth-child(2)::after {
    background: #ef9144;
}

.feature:nth-child(3)::after {
    background: #4b9bd2;
}

.feature:nth-child(4)::after {
    background: #e33d3d;
}

.feature:nth-child(5)::after {
    background: #8259c7;
}

.feature:nth-child(6)::after {
    background: #d6539b;
}

/* =========================
   ZBIÓRKA
========================= */

.meeting {
    margin-top: 13px;

    padding: 17px;

    background: white;

    border-radius: 19px;

    display: flex;

    align-items: center;

    box-shadow:
        0 4px 13px rgba(0,0,0,.08);

    cursor: pointer;
}

.meeting-icon {
    width: 48px;
    height: 48px;

    border-radius: 14px;

    background: #e4f5ec;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 25px;

    margin-right: 12px;
}

.meeting-text {
    flex: 1;
}

.meeting-text strong {
    display: block;

    font-size: 14px;
}

.meeting-text span {
    display: block;

    margin-top: 5px;

    color: #667286;

    font-size: 12px;
}

.meeting-arrow {
    font-size: 24px;

    color: #35b86b;
}

/* =========================
   SOS
========================= */

.sos {
    margin-top: 12px;

    width: 100%;

    border: none;

    border-radius: 19px;

    padding: 16px;

    background: #df3838;

    color: white;

    display: flex;

    align-items: center;

    cursor: pointer;

    box-shadow:
        0 5px 14px rgba(0,0,0,.12);
}

.sos-circle {
    width: 51px;
    height: 51px;

    border: 3px solid white;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-weight: bold;

    margin-right: 13px;
}

.sos-text {
    text-align: left;
    flex: 1;
}

.sos-text strong {
    display: block;

    font-size: 20px;
}

.sos-text span {
    font-size: 12px;
}

/* =========================
   HASŁO
========================= */

.slogan {
    margin-top: 14px;

    padding: 15px;

    background: #fffdf5;

    border-radius: 18px;

    text-align: center;

    border: 1px solid #f0ead5;
}

.slogan strong {
    display: block;

    font-size: 15px;

    color: #b48a22;
}

.slogan span {
    display: block;

    margin-top: 5px;

    font-size: 11px;

    color: #6c7480;
}

/* =========================
   DOLNA NAWIGACJA
========================= */

.bottom-nav {
    position: sticky;

    bottom: 0;

    width: 100%;

    height: 70px;

    background: white;

    border-top: 1px solid #e5e8eb;

    display: grid;

    grid-template-columns: repeat(5, 1fr);

    z-index: 50;
}

.nav-item {
    border: none;

    background: transparent;

    color: #7a8390;

    font-size: 10px;

    cursor: pointer;
}

.nav-item div {
    font-size: 22px;

    margin-bottom: 3px;
}

.nav-item.active {
    color: #35a966;

    font-weight: bold;
}

/* =========================
   MENU
========================= */

.menu-overlay {
    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.45);

    z-index: 100;

    display: none;
}

.menu-overlay.show {
    display: block;
}

.side-menu {
    width: min(88%, 400px);

    height: 100%;

    background: #17243a;

    padding: 22px 16px;

    overflow-y: auto;

    animation: menuOpen .25s ease;
}

@keyframes menuOpen {

    from {
        transform: translateX(-100%);
    }

    to {
        transform: translateX(0);
    }

}

.menu-top {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 22px;
}

.menu-top h2 {
    color: white;

    font-size: 25px;
}

.close-menu {
    border: none;

    background: transparent;

    color: white;

    font-size: 30px;

    cursor: pointer;
}

.menu-item {
    width: 100%;

    border: none;

    background: transparent;

    color: white;

    padding: 14px 8px;

    display: flex;

    align-items: center;

    text-align: left;

    border-bottom: 1px solid rgba(255,255,255,.08);

    cursor: pointer;
}

.menu-icon {
    width: 34px;

    font-size: 21px;

    margin-right: 8px;
}

.menu-item span:nth-child(2) {
    flex: 1;
}

.menu-arrow {
    color: #9aa8ba;
}

/* premium */

.premium {
    margin: 12px 0;

    background: #6d4fc2;

    border-radius: 13px;

    padding: 15px;
}

/* =========================
   RESPONSIVE
========================= */

@media (min-width: 700px) {

    .app {
        margin-top: 20px;

        border-radius: 25px;

        box-shadow:
            0 10px 40px rgba(0,0,0,.15);
    }

}

</style>
</head>

<script>

/* =========================
   MENU
========================= */

function openMenu() {

    document
        .getElementById("menuOverlay")
        .classList.add("show");

}


function closeMenu(event) {

    if (
        !event ||
        event.target.id === "menuOverlay"
    ) {

        document
            .getElementById("menuOverlay")
            .classList.remove("show");

    }

}


/* =========================

/* =========================
   ZBIÓRKA
========================= */

function openMeeting() {

    const place = prompt(
        "Podaj miejsce zbiórki:",
        "Plac Zamkowy"
    );

    if (!place) return;

    const time = prompt(
        "Podaj godzinę zbiórki:",
        "17:30"
    );

    if (!time) return;

    document.getElementById(
        "meetingInfo"
    ).textContent =
        place + " • " + time;

}
