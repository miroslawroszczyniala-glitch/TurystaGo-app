<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>TurystaGo — Start 1:1</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#111;font-family:Arial,sans-serif}
body{display:flex;justify-content:center;align-items:flex-start}
.app{
  position:relative;
  width:min(100vw,430px);
  aspect-ratio:719/1536;
  max-height:100vh;
  overflow:hidden;
  background:#fff;
}
.screen{
  position:absolute;inset:0;
  width:100%;height:100%;
  display:block;
  object-fit:fill;
}

/* Przezroczyste pola aktywne — wygląd pozostaje dokładnie jak na projekcie. */
.hotspot{
  position:absolute;
  border:0;
  background:transparent;
  cursor:pointer;
  padding:0;
}
.hotspot:focus-visible{
  outline:3px solid #63c20b;
  outline-offset:-3px;
  border-radius:20px;
}

/* Górne elementy */
.menu{left:4%;top:6.4%;width:9%;height:5%}
.notifications{right:4%;top:6%;width:9%;height:5%}

/* Główny przycisk */
.start-tour{left:4.5%;top:38.1%;width:91%;height:7.5%}

/* 8 kafelków */
.plan{left:4.5%;top:46.3%;width:21.5%;height:11.2%}
.attractions{left:27.3%;top:46.3%;width:21.5%;height:11.2%}
.audio{left:50.3%;top:46.3%;width:21.5%;height:11.2%}
.sos{left:73%;top:46.3%;width:22%;height:11.2%}

.groups{left:4.5%;top:58.2%;width:21.5%;height:11.2%}
.album{left:27.3%;top:58.2%;width:21.5%;height:11.2%}
.recommend{left:50.3%;top:58.2%;width:21.5%;height:11.2%}
.more{left:73%;top:58.2%;width:22%;height:11.2%}

/* Najbliższy obiekt i zbiórka */
.nearest{left:4.5%;top:71%;width:91%;height:11%}
.meeting{left:4.5%;top:83.3%;width:91%;height:7%}

/* Dolna nawigacja */
.nav-start{left:2%;bottom:0;width:18%;height:9.5%}
.nav-map{left:21%;bottom:0;width:18%;height:9.5%}
.nav-navigate{left:39%;bottom:0;width:22%;height:11%}
.nav-favourites{left:62%;bottom:0;width:18%;height:9.5%}
.nav-profile{right:2%;bottom:0;width:18%;height:9.5%}

@media(min-height:900px) and (min-width:431px){
  .app{height:100vh;width:auto}
}
</style>
</head>
<body>
<main class="app" aria-label="TurystaGo — ekran startowy">
  <img class="screen" src="turystago-start.png" alt="TurystaGo — ekran startowy">

  <button class="hotspot menu" aria-label="Menu" onclick="openModule('Menu')"></button>
  <button class="hotspot notifications" aria-label="Powiadomienia" onclick="openModule('Powiadomienia')"></button>

  <button class="hotspot start-tour" aria-label="Rozpocznij zwiedzanie" onclick="startTour()"></button>

  <button class="hotspot plan" aria-label="Zaplanuj zwiedzanie" onclick="openModule('Zaplanuj zwiedzanie')"></button>
  <button class="hotspot attractions" aria-label="Zabytki i atrakcje" onclick="openModule('Zabytki i atrakcje')"></button>
  <button class="hotspot audio" aria-label="Przewodnik audio" onclick="openModule('Przewodnik audio')"></button>
  <button class="hotspot sos" aria-label="SOS pomoc" onclick="openModule('SOS pomoc')"></button>

  <button class="hotspot groups" aria-label="Grupy i komunikator" onclick="openModule('Grupy i komunikator')"></button>
  <button class="hotspot album" aria-label="Album podróży" onclick="openModule('Album podróży')"></button>
  <button class="hotspot recommend" aria-label="Poleć znajomemu" onclick="openModule('Poleć znajomemu')"></button>
  <button class="hotspot more" aria-label="Więcej" onclick="openModule('Więcej')"></button>

  <button class="hotspot nearest" aria-label="Najbliższy obiekt" onclick="openModule('Najbliższy obiekt')"></button>
  <button class="hotspot meeting" aria-label="Miejsce i godzina zbiórki" onclick="openModule('Zbiórka')"></button>

  <button class="hotspot nav-start" aria-label="Start" onclick="openModule('Start')"></button>
  <button class="hotspot nav-map" aria-label="Mapa" onclick="openModule('Mapa')"></button>
  <button class="hotspot nav-navigate" aria-label="Nawiguj" onclick="startTour()"></button>
  <button class="hotspot nav-favourites" aria-label="Ulubione" onclick="openModule('Ulubione')"></button>
  <button class="hotspot nav-profile" aria-label="Profil" onclick="openModule('Profil')"></button>
</main>

<script>
function openModule(name){
  console.log("TurystaGo:", name);
  // Tutaj będziemy kolejno podłączać prawdziwe moduły aplikacji.
}
function startTour(){
  console.log("TurystaGo: rozpoczęto zwiedzanie od bieżącej lokalizacji");
  // Tutaj później podłączymy GPS i właściwy moduł zwiedzania.
}
</script>
</body>
</html>
